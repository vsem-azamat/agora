name: Release

# A v* tag on main, which only the maintainer creates, publishes a GitHub release with archives
# for Linux and macOS on amd64 and arm64 and their checksums; see docs/development/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to publish the release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the changelog compares with the previous tag, and main is checked below
          persist-credentials: false # the build and tests run third-party code; the write token stays out of .git
      - name: The tag is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "the tag ${GITHUB_REF_NAME} is not on main; releases are tags on main" >&2
            exit 1
          }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Build the web app; it must match the committed build
        run: make build-check
      - name: Test
        run: make test-go
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the pushed tag, also when an rc tag points at the same commit
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
