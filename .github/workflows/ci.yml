name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository, documentation and spec checks
        run: make repo

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/lint/go.sum
      - name: Lint and format (golangci-lint)
        run: make lint-go
      - name: Test
        run: make test
      - name: API lint and format (buf)
        run: make lint-proto
      - name: API breaking changes
        if: github.event_name == 'pull_request'
        env:
          BREAKING_AGAINST: ${{ github.server_url }}/${{ github.repository }}.git#branch=${{ github.base_ref }}
        run: make breaking
      - name: Generated code is up to date
        run: make generate-check

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: pnpm generate && git diff --exit-code src/gen && test -z "$(git status --porcelain src/gen)"
      - name: Lint and format
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Embedded build is up to date
        run: pnpm build && git status --porcelain ../internal/web/dist | tee /dev/stderr | (! grep .)
