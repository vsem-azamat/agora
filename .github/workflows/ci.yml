name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Repository, documentation and spec checks
        run: make repo

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/lint/go.sum
      - name: Lint and format (golangci-lint)
        run: make lint-go
      - name: Test
        run: make test-go
      - name: API lint and format (buf)
        run: make lint-proto
      - name: API breaking changes
        if: github.event_name == 'pull_request'
        env:
          BREAKING_AGAINST: ${{ github.server_url }}/${{ github.repository }}.git#branch=${{ github.base_ref }}
        run: make breaking
      - name: Generated code is up to date
        run: make generate-check

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - name: Generated client is up to date
        run: make generate-check-web
      - name: Lint and format (Biome)
        run: make lint-web
      - name: Test
        run: make test-web
      - name: Embedded build is up to date
        run: make build-check
