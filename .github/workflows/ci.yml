name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository policy
        run: scripts/repo-policy-check.sh
      - name: Documentation
        run: node scripts/docs-check.mjs
      - name: Spec layout
        run: scripts/spec-layout-check.sh
      - name: Spec format
        run: npx -y @fission-ai/openspec@1.12.0 validate --specs --no-interactive

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Format
        run: test -z "$(gofmt -l cmd internal | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: API lint
        run: go tool -modfile=tools/go.mod buf lint
      - name: Generated code is up to date
        run: go tool -modfile=tools/go.mod buf generate && git diff --exit-code gen
