# Release builds of agora for a v* tag; .github/workflows/release.yml runs it. The web app is built
# into internal/web/dist/ first, which git ignores, so the binaries embed it and the tree stays clean.
version: 2

before:
  hooks:
    - make build-web

project_name: agora

builds:
  - id: agora
    main: ./cmd/agora
    binary: agora
    env:
      - CGO_ENABLED=0 # the SQLite driver is pure Go
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # the tag itself, v-prefixed as go install reports it; agora version shows it. A snapshot gets
      # none, so it is not taken for the last release: agora version then says dev
      - -s -w -X github.com/vsem-azamat/agora/internal/version.Version={{ if not .IsSnapshot }}{{ .Tag }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: agora
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  draft: false
  prerelease: auto
