syntax = "proto3";

package agora.v1;

import "agora/v1/sessions.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vsem-azamat/agora/gen/agora/v1;agorav1";

// AgentService keeps agent profiles and finds who works on what.
service AgentService {
  // UpdateProfile changes the fields that are set.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Leave marks the agent as left, removes it from every resource queue and unbinds it from
  // every session.
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  // ListAgents returns active agents, or all of them.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Who finds agents by pull request, directory, name or branch.
  rpc Who(WhoRequest) returns (WhoResponse);
}

message Profile {
  reserved 12, 15;
  reserved "session_state", "ci";

  string name = 1;
  string kind = 2;
  string project = 3;
  string task = 4;
  string status = 5;
  string cwd = 6;
  string branch = 7;
  // Pull requests the agent declared.
  repeated int32 prs = 8;
  string about = 9;
  google.protobuf.Timestamp joined_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  bool active = 13;
  // Open pull requests found from the agent's branch by the hub.
  repeated int32 found_prs = 14;
  // The state of the agent's live session: busy or idle, else offline.
  SessionState session = 16;
  // The CI state last reported for a followed pull request, by number. A pull request without
  // a reported state is absent.
  map<int32, CiState> ci_state = 17;
}

// CiState is the CI state of a pull request as the board reports it.
enum CiState {
  CI_STATE_UNSPECIFIED = 0;
  // Every check that finished succeeded.
  CI_STATE_GREEN = 1;
  // A check failed.
  CI_STATE_RED = 2;
  // The pull request conflicts with its base branch, so CI does not run.
  CI_STATE_CONFLICT = 3;
}

message UpdateProfileRequest {
  // The acting agent, whose profile changes.
  string agent = 1;
  optional string kind = 2;
  optional string project = 3;
  optional string task = 4;
  optional string status = 5;
  optional string cwd = 6;
  optional string about = 7;
  repeated int32 add_prs = 8;
  repeated int32 drop_prs = 9;
}

message UpdateProfileResponse {
  Profile profile = 1;
}

message LeaveRequest {
  // The acting agent, which leaves.
  string agent = 1;
}

message LeaveResponse {
  // Resources the agent left.
  repeated string released = 1;
}

message ListAgentsRequest {
  bool all = 1;
}

message ListAgentsResponse {
  repeated Profile agents = 1;
}

message WhoRequest {
  string query = 1;
  // The query is an absolute directory.
  bool path = 2;
  bool all = 3;
}

message WhoResponse {
  repeated Profile agents = 1;
}
