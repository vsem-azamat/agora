syntax = "proto3";

package agora.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vsem-azamat/agora/gen/agora/v1;agorav1";

// BridgeService keeps the bridges that connect rooms to chats outside Agora, and the
// operator's decisions about what goes out through them.
service BridgeService {
  // AddBridge binds a bridge to the room of its name, creating the room or attaching an existing
  // one without a bridge, stores it with the hub's default policy, starts its command and
  // subscribes the addressees to the room with the mode wake.
  rpc AddBridge(AddBridgeRequest) returns (AddBridgeResponse);
  // RemoveBridge stops a bridge; its room and messages stay.
  rpc RemoveBridge(RemoveBridgeRequest) returns (RemoveBridgeResponse);
  // SetBridge changes a bridge's agents or command in place; its cursor stays. The hub starts
  // the new command when the command changed.
  rpc SetBridge(SetBridgeRequest) returns (SetBridgeResponse);
  // ListBridges returns every bridge with its state, in name order.
  rpc ListBridges(ListBridgesRequest) returns (ListBridgesResponse);
  // SetBridgePolicy changes what goes out through a bridge. Only the web listener serves it.
  rpc SetBridgePolicy(SetBridgePolicyRequest) returns (SetBridgePolicyResponse);
  // SendScheduled lets a scheduled message go out at once. Only the web listener serves it.
  rpc SendScheduled(SendScheduledRequest) returns (SendScheduledResponse);
  // CancelScheduled cancels a scheduled message, so it never goes out, and tells its author. Only
  // the web listener serves it.
  rpc CancelScheduled(CancelScheduledRequest) returns (CancelScheduledResponse);
  // SendNoteOut sends a note out: a new message of the note's author with its text goes out at
  // once, and the note stays. Only the web listener serves it.
  rpc SendNoteOut(SendNoteOutRequest) returns (SendNoteOutResponse);
}

// What goes out of a bridged room.
enum BridgePolicy {
  BRIDGE_POLICY_UNSPECIFIED = 0;
  reserved 1;
  reserved "BRIDGE_POLICY_APPROVE";
  // Every message goes out at once.
  BRIDGE_POLICY_OPEN = 2;
  // Nothing goes out; agents may not post.
  BRIDGE_POLICY_READ = 3;
  // Agents' messages go out once the hub's delay passed, unless the operator cancels them or
  // sends them at once; the operator's go out at once.
  BRIDGE_POLICY_DELAY = 4;
}

// Whether the hub runs a bridge's command.
enum BridgeState {
  BRIDGE_STATE_UNSPECIFIED = 0;
  // Its process runs.
  BRIDGE_STATE_RUNNING = 1;
  // Its process exited; the hub starts it again after a delay.
  BRIDGE_STATE_RESTARTING = 2;
  // The hub does not run it.
  BRIDGE_STATE_STOPPED = 3;
}

message Bridge {
  // The bridge's name, which is also its room's.
  string name = 1;
  string command = 2;
  BridgePolicy policy = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  // The agents an addressed message from outside addresses, in name order.
  repeated string addressees = 6;
  BridgeState state = 7;
  // How its process last ended, while restarting.
  string last_exit = 8;
  // What the bridge said its platform can do in its current run; unset when it said nothing.
  BridgeCaps caps = 9;
}

// What a bridge's platform can do, as the bridge says it in short words; empty when unknown.
message BridgeCaps {
  // How it shows who wrote a message that goes out, such as prefix.
  string personas = 1;
  // How it keeps threads, such as topic.
  string threads = 2;
}

message AddBridgeRequest {
  // The acting agent, which becomes the creator.
  string agent = 1;
  // The bridge's and its room's name.
  string name = 2;
  // The shell command the hub runs.
  string command = 3;
  // The purpose of a room created for the bridge; a default when empty.
  string purpose = 4;
  // Agents to subscribe to the room with the mode wake; an addressed message from outside
  // addresses them.
  repeated string addressees = 5;
}

message AddBridgeResponse {
  // True when the room was created, false when an existing room was attached.
  bool created_room = 1;
  // The policy the bridge got: the hub's default.
  BridgePolicy policy = 2;
}

message RemoveBridgeRequest {
  // The acting agent.
  string agent = 1;
  string name = 2;
}

message RemoveBridgeResponse {}

message SetBridgeRequest {
  // The acting agent.
  string agent = 1;
  string name = 2;
  // Replace the bridge's agents with addressees, none when it is empty.
  bool set_addressees = 3;
  // The new agents; agents that were not among them are subscribed to the room with the mode
  // wake.
  repeated string addressees = 4;
  // The new command; empty leaves it.
  string command = 5;
}

message SetBridgeResponse {
  // The bridge's agents now, in name order.
  repeated string addressees = 1;
  // The agents no longer among them, in name order; they still follow the room.
  repeated string dropped = 2;
  // The command changed, and the hub started the new one.
  bool restarted = 3;
}

message ListBridgesRequest {}

message ListBridgesResponse {
  repeated Bridge bridges = 1;
}

message SetBridgePolicyRequest {
  string name = 1;
  BridgePolicy policy = 2;
}

message SetBridgePolicyResponse {}

message SendScheduledRequest {
  int64 message_id = 1;
}

message SendScheduledResponse {}

message CancelScheduledRequest {
  int64 message_id = 1;
}

message CancelScheduledResponse {}

message SendNoteOutRequest {
  int64 message_id = 1;
}

message SendNoteOutResponse {
  // The message that goes out.
  int64 id = 1;
}
