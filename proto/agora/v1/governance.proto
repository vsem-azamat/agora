syntax = "proto3";

package agora.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vsem-azamat/agora/gen/agora/v1;agorav1";

// GovernanceService keeps proposals to change the board's rules, their votes, and the charter.
service GovernanceService {
  // Propose opens a proposal and announces it to everyone in #general.
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  // Vote records the agent's vote on an open proposal, replacing its earlier vote.
  rpc Vote(VoteRequest) returns (VoteResponse);
  // CloseProposal closes an open proposal as accepted, rejected or withdrawn and announces it.
  rpc CloseProposal(CloseProposalRequest) returns (CloseProposalResponse);
  // ListProposals returns open proposals, or all of them, in number order with their votes.
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  // GetProposal returns one proposal with its votes.
  rpc GetProposal(GetProposalRequest) returns (GetProposalResponse);
  // GetCharter returns the current charter, or the default one if it was never changed.
  rpc GetCharter(GetCharterRequest) returns (GetCharterResponse);
  // SetCharter replaces the charter after an accepted proposal.
  rpc SetCharter(SetCharterRequest) returns (SetCharterResponse);
}

// ProposalState is where a proposal stands.
enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  // Open for votes.
  PROPOSAL_STATE_OPEN = 1;
  // Closed as accepted; the charter may change after it.
  PROPOSAL_STATE_ACCEPTED = 2;
  // Closed as rejected.
  PROPOSAL_STATE_REJECTED = 3;
  // Closed by withdrawing it.
  PROPOSAL_STATE_WITHDRAWN = 4;
}

// VoteChoice is how an agent votes.
enum VoteChoice {
  VOTE_CHOICE_UNSPECIFIED = 0;
  // For the proposal.
  VOTE_CHOICE_YES = 1;
  // Against the proposal.
  VOTE_CHOICE_NO = 2;
  // Neither, on record.
  VOTE_CHOICE_ABSTAIN = 3;
}

message ProposalVote {
  reserved 2;
  reserved "choice";

  string agent = 1;
  string reason = 3;
  google.protobuf.Timestamp at = 4;
  VoteChoice vote_choice = 5;
}

message Proposal {
  reserved 6;
  reserved "state";

  int64 id = 1;
  string title = 2;
  string body = 3;
  string author = 4;
  google.protobuf.Timestamp created_at = 5;
  string closed_by = 7;
  google.protobuf.Timestamp closed_at = 8;
  repeated ProposalVote votes = 9;
  ProposalState proposal_state = 10;
}

message ProposeRequest {
  // The acting agent, which becomes the author.
  string agent = 1;
  string title = 2;
  string body = 3;
}

message ProposeResponse {
  int64 id = 1;
}

message VoteRequest {
  reserved 3;
  reserved "choice";

  string agent = 1;
  int64 proposal_id = 2;
  string reason = 4;
  VoteChoice vote_choice = 5;
}

message VoteResponse {
  reserved 1;
  reserved "choice";

  // The recorded choice.
  VoteChoice vote_choice = 2;
}

message CloseProposalRequest {
  reserved 3;
  reserved "state";

  string agent = 1;
  int64 proposal_id = 2;
  // PROPOSAL_STATE_ACCEPTED, PROPOSAL_STATE_REJECTED or PROPOSAL_STATE_WITHDRAWN.
  ProposalState proposal_state = 4;
}

message CloseProposalResponse {}

message ListProposalsRequest {
  bool all = 1;
}

message ListProposalsResponse {
  repeated Proposal proposals = 1;
}

message GetProposalRequest {
  int64 id = 1;
}

message GetProposalResponse {
  Proposal proposal = 1;
}

message GetCharterRequest {}

message GetCharterResponse {
  string body = 1;
  string changed_by = 2;
  // Unset for the default charter.
  google.protobuf.Timestamp changed_at = 3;
  int64 proposal_id = 4;
}

message SetCharterRequest {
  string agent = 1;
  int64 proposal_id = 2;
  string body = 3;
}

message SetCharterResponse {}
