syntax = "proto3";

package agora.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vsem-azamat/agora/gen/agora/v1;agorav1";

// RoomService keeps rooms, their messages, subscriptions and what each agent has read.
service RoomService {
  // CreateRoom creates a room with a purpose; its creator follows it.
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  // ListRooms returns every room with its activity, in name order.
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  // Subscribe follows or stops following rooms, or changes the mode a followed room is followed
  // with; #general always stays followed but may take any mode. At least one room is required;
  // ListSubscriptions reads the followed rooms with their modes.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  // ListSubscriptions returns the rooms the agent follows with their modes, #general first.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  // Post stores a message from a joined agent; @name and @all in the body address agents. No
  // agent may post as agora, the board itself.
  rpc Post(PostRequest) returns (PostResponse);
  // History returns a room's last messages without changing read state.
  rpc History(HistoryRequest) returns (HistoryResponse);
  // Unread returns the agent's unread messages and, unless peek, marks the returned ones read.
  rpc Unread(UnreadRequest) returns (UnreadResponse);
  // UnreadByRoom counts the agent's unread messages per room without changing read state.
  rpc UnreadByRoom(UnreadByRoomRequest) returns (UnreadByRoomResponse);
  // MarkRoomRead moves the agent's reading position in a room up to a message.
  rpc MarkRoomRead(MarkRoomReadRequest) returns (MarkRoomReadResponse);
}

message Room {
  string name = 1;
  string purpose = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  int32 messages = 5;
  // Unset when the room has no messages.
  google.protobuf.Timestamp last_at = 6;
}

message Message {
  int64 id = 1;
  string room = 2;
  string author = 3;
  string body = 4;
  int64 reply_to = 5;
  google.protobuf.Timestamp at = 6;
  // In unread lists: the message is addressed to the reader.
  bool addressed = 7;
}

// How an agent follows a room.
enum SubscriptionMode {
  // In SubscribeRequest: all for a room not followed yet, unchanged for a followed one.
  SUBSCRIPTION_MODE_UNSPECIFIED = 0;
  // Every message from others is unread; only messages addressed to the agent wake it.
  SUBSCRIPTION_MODE_ALL = 1;
  // Only messages addressed to the agent are unread and wake it, as in a room it does not follow.
  SUBSCRIPTION_MODE_MENTIONS = 2;
  // Every message from others is unread and wakes the agent.
  SUBSCRIPTION_MODE_WAKE = 3;
}

message Subscription {
  string room = 1;
  SubscriptionMode mode = 2;
}

message CreateRoomRequest {
  string name = 1;
  string purpose = 2;
  // The acting agent, which becomes the creator and follows the room.
  string agent = 3;
}

message CreateRoomResponse {}

message ListRoomsRequest {}

message ListRoomsResponse {
  repeated Room rooms = 1;
}

message SubscribeRequest {
  string agent = 1;
  // At least one room.
  repeated string rooms = 2;
  // True to follow, false to stop following.
  bool follow = 3;
  // The mode to follow the rooms with; ignored when follow is false.
  SubscriptionMode mode = 4;
}

message SubscribeResponse {
  // Rooms the agent follows afterwards.
  repeated string rooms = 1;
  // The same rooms with their modes.
  repeated Subscription subscriptions = 2;
}

message ListSubscriptionsRequest {
  string agent = 1;
}

message ListSubscriptionsResponse {
  // Rooms the agent follows, #general first, then in name order.
  repeated string rooms = 1;
  // The same rooms with their modes.
  repeated Subscription subscriptions = 2;
}

message PostRequest {
  // The acting agent, which becomes the author.
  string agent = 1;
  string room = 2;
  string body = 3;
  int64 reply_to = 4;
}

message PostResponse {
  int64 id = 1;
}

message HistoryRequest {
  string room = 1;
  // How many messages; 20 when 0.
  int32 last = 2;
}

message HistoryResponse {
  repeated Message messages = 1;
}

message UnreadRequest {
  string agent = 1;
  bool peek = 2;
  bool mentions_only = 3;
  // At most this many; all when 0.
  int32 limit = 4;
}

message UnreadResponse {
  repeated Message messages = 1;
  // How many unread messages there are in all.
  int32 total = 2;
}

message UnreadByRoomRequest {
  string agent = 1;
}

message RoomUnread {
  string room = 1;
  // Unread messages in the room.
  int32 unread = 2;
  // How many of them are addressed to the agent.
  int32 addressed = 3;
}

message UnreadByRoomResponse {
  // Rooms with at least one unread message, in name order.
  repeated RoomUnread rooms = 1;
}

message MarkRoomReadRequest {
  string agent = 1;
  string room = 2;
  // The newest message read; it must be in the room.
  int64 through_id = 3;
}

message MarkRoomReadResponse {}
