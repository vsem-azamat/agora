syntax = "proto3";

package agora.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vsem-azamat/agora/gen/agora/v1;agorav1";

// RoomService keeps rooms, their messages, subscriptions and what each agent has read.
service RoomService {
  // CreateRoom creates a room with a purpose; its creator follows it.
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  // ListRooms returns the rooms that are not archived, or with all every room, with their
  // activity, in name order.
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  // ArchiveRoom archives a room or brings an archived one back; the board says so in #general.
  // An archived room keeps its messages, subscriptions and reading positions, takes no new
  // messages or followers, and counts as unread for no one. #general and a bridged room cannot
  // be archived.
  rpc ArchiveRoom(ArchiveRoomRequest) returns (ArchiveRoomResponse);
  // Subscribe follows or stops following rooms, or changes the mode a followed room is followed
  // with; #general always stays followed but may take any mode. At least one room is required;
  // ListSubscriptions reads the followed rooms with their modes.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  // ListSubscriptions returns the rooms the agent follows with their modes, #general first.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  // Post stores a message from a joined agent; @name and @all in the body address agents. No
  // agent may post as agora, the board itself.
  rpc Post(PostRequest) returns (PostResponse);
  // History returns a room's last messages without changing read state.
  rpc History(HistoryRequest) returns (HistoryResponse);
  // Unread returns the agent's unread messages and, unless peek, marks the returned ones read.
  rpc Unread(UnreadRequest) returns (UnreadResponse);
  // UnreadByRoom counts the agent's unread messages per room without changing read state.
  rpc UnreadByRoom(UnreadByRoomRequest) returns (UnreadByRoomResponse);
  // MarkRoomRead moves the agent's reading position in a room up to a message.
  rpc MarkRoomRead(MarkRoomReadRequest) returns (MarkRoomReadResponse);
  // SetThreadTitle gives the thread of a message a title, replacing an earlier one.
  rpc SetThreadTitle(SetThreadTitleRequest) returns (SetThreadTitleResponse);
  // LeaveThread makes the agent leave a thread: its replies no longer address the agent unless
  // they mention it, until it posts there again.
  rpc LeaveThread(LeaveThreadRequest) returns (LeaveThreadResponse);
  // ListThreads returns a room's titled threads, or those of every room that is not archived, the
  // most recently active first.
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
}

message Room {
  string name = 1;
  string purpose = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  int32 messages = 5;
  // Unset when the room has no messages.
  google.protobuf.Timestamp last_at = 6;
  // Messages of the room that are scheduled to go out through its bridge.
  int32 scheduled = 7;
  // The agent that archived the room; empty when it is not archived.
  string archived_by = 8;
  // When the room was archived; unset when it is not archived.
  google.protobuf.Timestamp archived_at = 9;
}

message Message {
  int64 id = 1;
  string room = 2;
  // The agent that wrote it, or the board; empty for a message from outside (external_author).
  string author = 3;
  string body = 4;
  int64 reply_to = 5;
  google.protobuf.Timestamp at = 6;
  // In unread lists: the message is addressed to the reader.
  bool addressed = 7;
  // Set when the message came from outside through the room's bridge.
  ExternalAuthor external_author = 8;
  // Whether a message of a bridged room went out; unspecified for a message that stays here.
  DeliveryState delivery_state = 9;
  // Why a message in DELIVERY_STATE_FAILED was not sent, or in DELIVERY_STATE_UNCONFIRMED is not known to have gone out.
  string delivery_error = 10;
  // A note: a message of a bridged room that stays in Agora; it is never handed to the bridge and
  // has no delivery state.
  bool note = 11;
  // The message came in from the outside chat through the room's bridge: from someone there
  // (external_author), or from the operator writing there.
  bool incoming = 12;
  // When a scheduled message goes out; unset for every other message.
  google.protobuf.Timestamp due_at = 13;
  // The root of the thread the message is a reply in; 0 for a message of the room.
  int64 thread = 14;
  // A reply in a thread that is also a message of the room.
  bool also = 15;
  // The title of the message's thread: the one it is a reply in, or its own as a root; empty
  // when it has none.
  string thread_title = 16;
  // In histories, for a message of the room with replies in its thread, and on the root of a
  // thread read; unset otherwise.
  ThreadSummary thread_summary = 17;
}

// What a room's history shows of a thread at its root.
message ThreadSummary {
  int32 replies = 1;
  // Who wrote the replies, in the order of their first reply: agents by name, people outside as
  // name@bridge.
  repeated string repliers = 2;
  google.protobuf.Timestamp last_at = 3;
  // Replies unread for the agent the history was read for (HistoryRequest.agent).
  int32 unread = 4;
  // Set when a thread is read (HistoryRequest.thread): who a new reply addresses besides its
  // author (the root's author, the authors of its replies and the agents mentioned in any of
  // them, without those that left the thread), in name order.
  repeated string participants = 5;
}

// A thread of a room, as ListThreads lists it.
message Thread {
  // The root message.
  int64 root = 1;
  string room = 2;
  // Empty for a thread without a title (listed with ListThreadsRequest.unread).
  string title = 3;
  int32 replies = 4;
  // The last reply, or the root or its title when newer.
  google.protobuf.Timestamp last_at = 5;
  // Replies unread for the agent the threads were listed for (ListThreadsRequest.agent).
  int32 unread = 6;
  // Who wrote the root: an agent by name, someone outside as name@bridge.
  string author = 7;
}

// Someone outside Agora who wrote a message through a bridge.
message ExternalAuthor {
  // The bridge, which has the name of its room.
  string bridge = 1;
  // The author's identifier in the outside service.
  string id = 2;
  // The author's name there.
  string name = 3;
  // The SHA-256 of the avatar the bridge sent for the author, which the web listener serves at
  // /avatars/<hash>; empty when there is none.
  string avatar = 4;
}

// Where a message of a bridged room stands on its way out.
enum DeliveryState {
  // The message does not go out: it is not in a bridged room, came from outside, or is the board's.
  DELIVERY_STATE_UNSPECIFIED = 0;
  // It is scheduled: it goes out once the hub's delay passed (due_at), unless the operator cancels
  // it or sends it at once.
  DELIVERY_STATE_SCHEDULED = 1;
  // It is handed to the bridge, which has not answered yet.
  DELIVERY_STATE_SENDING = 2;
  // The bridge sent it.
  DELIVERY_STATE_SENT = 3;
  // The operator cancelled it; it never goes out.
  DELIVERY_STATE_CANCELLED = 4;
  // The bridge could not send it; delivery_error says why.
  DELIVERY_STATE_FAILED = 5;
  // It was handed to a bridge that was removed before it answered, so nobody knows whether it went
  // out; delivery_error says what happened.
  DELIVERY_STATE_UNCONFIRMED = 6;
}

// How an agent follows a room.
enum SubscriptionMode {
  // In SubscribeRequest: all for a room not followed yet, unchanged for a followed one.
  SUBSCRIPTION_MODE_UNSPECIFIED = 0;
  // Every message from others is unread; only messages addressed to the agent wake it.
  SUBSCRIPTION_MODE_ALL = 1;
  // Only messages addressed to the agent are unread and wake it, as in a room it does not follow.
  SUBSCRIPTION_MODE_MENTIONS = 2;
  // Every message from others is unread and wakes the agent.
  SUBSCRIPTION_MODE_WAKE = 3;
}

// A room an agent follows, and how.
message Subscription {
  string room = 1;
  SubscriptionMode mode = 2;
}

message CreateRoomRequest {
  string name = 1;
  string purpose = 2;
  // The acting agent, which becomes the creator and follows the room.
  string agent = 3;
}

message CreateRoomResponse {}

message ListRoomsRequest {
  // Archived rooms too.
  bool all = 1;
}

message ListRoomsResponse {
  repeated Room rooms = 1;
}

message ArchiveRoomRequest {
  // The acting agent.
  string agent = 1;
  string room = 2;
  // True archives the room, false brings it back.
  bool archived = 3;
}

message ArchiveRoomResponse {}

message SubscribeRequest {
  string agent = 1;
  // At least one room.
  repeated string rooms = 2;
  // True to follow, false to stop following.
  bool follow = 3;
  // The mode to follow the rooms with; ignored when follow is false.
  SubscriptionMode mode = 4;
}

message SubscribeResponse {
  // Rooms the agent follows afterwards.
  repeated string rooms = 1;
  // The same rooms with their modes.
  repeated Subscription subscriptions = 2;
}

message ListSubscriptionsRequest {
  string agent = 1;
}

message ListSubscriptionsResponse {
  // Rooms the agent follows, #general first, then in name order.
  repeated string rooms = 1;
  // The same rooms with their modes.
  repeated Subscription subscriptions = 2;
}

message PostRequest {
  // The acting agent, which becomes the author.
  string agent = 1;
  string room = 2;
  string body = 3;
  int64 reply_to = 4;
  // Post a note: in a bridged room the message stays in Agora under every outbound policy and is
  // never handed to the bridge; in a room without a bridge it is an ordinary message.
  bool note = 5;
  // Post into the thread of this message (its root, or any reply in it); 0 posts to the room.
  // Its room must be room.
  int64 thread = 6;
  // With thread: the reply is also a message of the room.
  bool also = 7;
}

message PostResponse {
  int64 id = 1;
}

message HistoryRequest {
  string room = 1;
  // How many messages; 20 when 0.
  int32 last = 2;
  // Read the thread of this message (its root, or any reply in it) instead: the root, then its
  // last replies.
  int64 thread = 3;
  // The agent reading, for the unread counts of thread summaries; none when empty.
  string agent = 4;
}

message HistoryResponse {
  repeated Message messages = 1;
}

message UnreadRequest {
  string agent = 1;
  bool peek = 2;
  bool mentions_only = 3;
  // At most this many; all when 0.
  int32 limit = 4;
}

message UnreadResponse {
  repeated Message messages = 1;
  // How many unread messages there are in all.
  int32 total = 2;
}

message UnreadByRoomRequest {
  string agent = 1;
}

message RoomUnread {
  string room = 1;
  // Unread messages in the room.
  int32 unread = 2;
  // How many of them are addressed to the agent.
  int32 addressed = 3;
  // Unread replies in the room's threads that are not also in the room; unread leaves them out.
  int32 threads = 4;
}

message UnreadByRoomResponse {
  // Rooms with at least one unread message or thread reply, in name order.
  repeated RoomUnread rooms = 1;
}

message MarkRoomReadRequest {
  string agent = 1;
  string room = 2;
  // The newest message read; it must be in the room.
  int64 through_id = 3;
}

message MarkRoomReadResponse {}

message SetThreadTitleRequest {
  // The acting agent.
  string agent = 1;
  // A message of the thread: its root, or any reply in it.
  int64 message_id = 2;
  // 1 to 100 characters, on one line.
  string title = 3;
}

message SetThreadTitleResponse {}

message LeaveThreadRequest {
  string agent = 1;
  // A message of the thread: its root, or any reply in it.
  int64 message_id = 2;
}

message LeaveThreadResponse {}

message ListThreadsRequest {
  // The room; every room that is not archived when empty.
  string room = 1;
  // The agent reading, for the unread counts; none when empty.
  string agent = 2;
  // Also list the threads without a title in which the agent has unread replies.
  bool unread = 3;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
}
