syntax = "proto3";

package agora.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vsem-azamat/agora/gen/agora/v1;agorav1";

// SessionService keeps agent names and the agent sessions that connectors report.
service SessionService {
  // Report records one connector event and returns what the connector should tell the agent.
  rpc Report(ReportRequest) returns (ReportResponse);
  // JoinName binds a name to a session, or only registers the name when no session is given.
  rpc JoinName(JoinNameRequest) returns (JoinNameResponse);
  // Resolve returns the name bound to a session.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // ListSessions returns sessions that have not ended.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // WaitWake waits on behalf of an idle session. The stream first sends an armed message, then
  // one message with the wake text when something needs the agent, or ends without it when the
  // session gets busy, ends, or a newer wait for it starts.
  rpc WaitWake(WaitWakeRequest) returns (stream WaitWakeResponse);
  // Compact queues a compaction of an agent's conversation; it runs when the session is idle.
  rpc Compact(CompactRequest) returns (CompactResponse);
  // Interrupt stops the turn of a busy session at once.
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
}

enum SessionEvent {
  SESSION_EVENT_UNSPECIFIED = 0;
  SESSION_EVENT_START = 1;
  SESSION_EVENT_PROMPT = 2;
  SESSION_EVENT_TOOL = 3;
  SESSION_EVENT_STOP = 4;
  SESSION_EVENT_END = 5;
  // The session waits at its prompt after a turn that ended without a stop, such as a failed
  // one.
  SESSION_EVENT_WAITING = 6;
  // The conversation is about to be compacted; reason says whether the user asked for it
  // ("manual") or the agent tool does it by itself ("auto").
  SESSION_EVENT_COMPACT = 7;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_BUSY = 1;
  SESSION_STATE_IDLE = 2;
  SESSION_STATE_ENDED = 3;
  // Only in profiles: the agent has no live session.
  SESSION_STATE_OFFLINE = 4;
}

message Session {
  string id = 1;
  string kind = 2;
  string agent = 3;
  SessionState state = 4;
  google.protobuf.Timestamp state_at = 5;
  google.protobuf.Timestamp started_at = 6;
  int32 pid = 7;
  string cwd = 8;
  string terminal = 9;
  SessionCapabilities capabilities = 10;
}

// SessionMechanism is how the hub does an action for a session.
enum SessionMechanism {
  SESSION_MECHANISM_UNSPECIFIED = 0;
  // The session cannot do it.
  SESSION_MECHANISM_NONE = 1;
  // The session's connector does it.
  SESSION_MECHANISM_HOOK = 2;
  // The hub runs its command for the session's terminal.
  SESSION_MECHANISM_TERMINAL = 3;
}

// SessionCapabilities says how the hub can do each action for a session.
message SessionCapabilities {
  SessionMechanism wake = 1;
  SessionMechanism compact = 2;
  SessionMechanism interrupt = 3;
}

message ReportRequest {
  string session_id = 1;
  string kind = 2;
  SessionEvent event = 3;
  int32 pid = 4;
  string cwd = 5;
  string terminal = 6;
  // The turn is already continuing because of an earlier block.
  bool stop_active = 7;
  // Start time of the process, in the units the platform reports (0 when unknown).
  int64 pid_start = 8;
  // Why the session starts (for START) or ends (for END), as the agent tool reports it, e.g.
  // "compact" or "clear".
  string reason = 9;
}

message ReportResponse {
  // Text to add to the agent's context; empty for none.
  string context = 1;
  // For STOP: keep the turn going, with block_reason as the agent's next input.
  bool block = 2;
  string block_reason = 3;
}

message JoinNameRequest {
  string name = 1;
  string session_id = 2;
  bool force = 3;
}

message JoinNameResponse {
  // Whether the name is now bound to the session.
  bool bound = 1;
}

message ResolveRequest {
  string session_id = 1;
}

message ResolveResponse {
  // Empty when the session is unknown, ended or bound to no name.
  string agent = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message WaitWakeRequest {
  string session_id = 1;
  // The wait begins at a session start, whose report may reach the hub after the wait: the hub
  // waits a short while for the session to be bound to an agent before it gives up.
  bool start = 2;
}

message WaitWakeResponse {
  // The wake text; empty in the first, armed message.
  string text = 1;
  // The wait is registered; sent once, first.
  bool armed = 2;
}

message CompactRequest {
  // The agent that asks.
  string agent = 1;
  // The agent whose conversation is compacted.
  string target = 2;
  // What the compacted conversation should keep; may be empty.
  string focus = 3;
}

message CompactResponse {
  // How the compaction will be done.
  SessionMechanism mechanism = 1;
}

message InterruptRequest {
  // The agent that asks.
  string agent = 1;
  // The agent whose turn is interrupted.
  string target = 2;
}

message InterruptResponse {
  // How the turn was interrupted.
  SessionMechanism mechanism = 1;
}
