syntax = "proto3";

package agora.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vsem-azamat/agora/gen/agora/v1;agorav1";

// SessionService keeps agent names and the agent sessions that connectors report.
service SessionService {
  // Report records one connector event and returns what the connector should tell the agent.
  rpc Report(ReportRequest) returns (ReportResponse);
  // JoinName binds a name to a session, or only registers the name when no session is given.
  rpc JoinName(JoinNameRequest) returns (JoinNameResponse);
  // Resolve returns the name bound to a session.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // ListSessions returns sessions that have not ended.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}

enum SessionEvent {
  SESSION_EVENT_UNSPECIFIED = 0;
  SESSION_EVENT_START = 1;
  SESSION_EVENT_PROMPT = 2;
  SESSION_EVENT_TOOL = 3;
  SESSION_EVENT_STOP = 4;
  SESSION_EVENT_END = 5;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_BUSY = 1;
  SESSION_STATE_IDLE = 2;
  SESSION_STATE_ENDED = 3;
}

message Session {
  string id = 1;
  string kind = 2;
  string agent = 3;
  SessionState state = 4;
  google.protobuf.Timestamp state_at = 5;
  google.protobuf.Timestamp started_at = 6;
  int32 pid = 7;
  string cwd = 8;
  string terminal = 9;
}

message ReportRequest {
  string session_id = 1;
  string kind = 2;
  SessionEvent event = 3;
  int32 pid = 4;
  string cwd = 5;
  string terminal = 6;
  // The turn is already continuing because of an earlier block.
  bool stop_active = 7;
}

message ReportResponse {
  // Text to add to the agent's context; empty for none.
  string context = 1;
  // For STOP: keep the turn going, with block_reason as the agent's next input.
  bool block = 2;
  string block_reason = 3;
}

message JoinNameRequest {
  string name = 1;
  string session_id = 2;
  bool force = 3;
}

message JoinNameResponse {
  // Whether the name is now bound to the session.
  bool bound = 1;
}

message ResolveRequest {
  string session_id = 1;
}

message ResolveResponse {
  // Empty when the session is unknown, ended or bound to no name.
  string agent = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}
